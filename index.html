<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hand Framing — TensorFlow.js + fingerpose</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main>
      <h1>Hand Framing Demo</h1>
      <p id="status">Loading model…</p>
      <div id="stage">
        <video id="video" playsinline muted></video>
        <canvas id="overlay"></canvas>
      </div>
      <p class="hint">
        Show both hands with thumb + index finger extended (like framing a photo)
        to draw a rectangle between them.
      </p>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
